name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permissions minimales : la CI ne fait que lire le code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'hygiène du dépôt (constitution, principe VI)
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^data/.*\.json$'; then
            echo "Fichier sensible ou de données locales versionné."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v
