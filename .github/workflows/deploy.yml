name: CD - Déploiement Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions nécessaires pour Workload Identity Federation (WIF)
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Exécution des tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Vérifier l'hygiène du dépôt
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^data/.*\.json$'; then
            echo "Erreur : fichier sensible ou de données locales détecté."
            exit 1
          fi

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer la suite de tests
        run: python -m pytest -v

  deploy:
    name: Build & Déploiement sur Google Cloud Run
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Authentification GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurer le SDK Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurer l'authentification Docker pour Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Définir le nom complet de l'image
        run: |
          IMAGE_BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE_NAME }}"
          echo "IMAGE_TAG=${IMAGE_BASE}:${{ github.sha }}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=${IMAGE_BASE}:latest" >> $GITHUB_ENV

      - name: Construire l'image Docker
        run: |
          docker build \
            -t "${IMAGE_TAG}" \
            -t "${IMAGE_LATEST}" \
            .

      - name: Pousser l'image vers Google Artifact Registry
        run: |
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_LATEST}"

      - name: Déployer sur Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.GCP_SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE_TAG }}

      - name: Afficher l'URL du service déployé
        run: |
          echo "Application déployée avec succès !"
          echo "URL d'accès : ${{ steps.deploy.outputs.url }}"
